name: Daily price scrape (Noon)

# Noon geo-blocks GitHub's US datacenter IP (serves a bot-challenge shell), so a
# scheduled run from here can't succeed — Noon is scraped from an Egyptian egress
# instead (see docs/egyptian-egress.md). The daily cron is therefore disabled;
# manual dispatch is kept for the rare case of testing Noon from the runner.
on:
  # schedule:
  #   - cron: "0 5 * * *"   # disabled: Noon needs an Egyptian IP (see docs/egyptian-egress.md)
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh (price-only, daily) | match (find product URLs)"
        required: false
        default: "refresh"

jobs:
  scrape-noon:
    runs-on: ubuntu-latest
    # Noon is throttled (1 product at a time, 2.5s apart) so a full refresh of
    # ~170 mappings plus JS renders runs past 60 min on a slow day and gets
    # cancelled mid-pass (run #13, Aug 24). Give it runway to finish.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper (Noon only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Scheduled runs have empty inputs -> SCRAPE_MODE unset -> defaults to 'refresh'.
          SCRAPE_MODE: ${{ github.event.inputs.mode }}
          SCRAPE_SLUGS: noon
        run: npm run scrape
