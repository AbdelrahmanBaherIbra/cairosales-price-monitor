name: Daily price scrape

# Clean, fast competitors. Noon (bot-protected + throttled) runs on its own
# schedule in scrape-noon.yml so it can't slow down or fail this job.
on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 07:00 Cairo
  workflow_dispatch: # allow manual runs from the Actions tab
    inputs:
      mode:
        description: "refresh (price-only, daily) | match (find product URLs)"
        required: false
        default: "match"
      slugs:
        description: "Comma-separated competitor slugs (blank = all)"
        required: false
        default: ""
      exclude:
        description: "Slugs to skip (blank = noon, which has its own workflow)"
        required: false
        default: ""
      brand:
        description: "Match mode only: limit to one brand (brand-by-brand rollout)"
        required: false
        default: ""
      limit:
        description: "Max products per competitor (blank = all)"
        required: false
        default: ""
      debug:
        description: "Dump rendered-HTML diagnostics for the first product (1 = on)"
        required: false
        default: ""
      code:
        description: "Only scrape these model code(s), comma-separated (blank = all)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Scheduled runs have empty inputs -> SCRAPE_MODE unset -> defaults to 'refresh'.
          SCRAPE_MODE: ${{ github.event.inputs.mode }}
          SCRAPE_SLUGS: ${{ github.event.inputs.slugs }}
          # Blank exclude (incl. scheduled runs) -> skip noon; it runs in scrape-noon.yml.
          SCRAPE_EXCLUDE: ${{ github.event.inputs.exclude || 'noon' }}
          SCRAPE_BRAND: ${{ github.event.inputs.brand }}
          SCRAPE_LIMIT: ${{ github.event.inputs.limit }}
          SCRAPE_DEBUG: ${{ github.event.inputs.debug }}
          SCRAPE_CODE: ${{ github.event.inputs.code }}
        run: npm run scrape
