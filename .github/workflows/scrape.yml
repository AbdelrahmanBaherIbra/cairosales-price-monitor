name: Daily price scrape

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 07:00 Cairo
  workflow_dispatch: # allow manual runs from the Actions tab
    inputs:
      slugs:
        description: "Comma-separated competitor slugs (blank = all)"
        required: false
        default: "raya"
      limit:
        description: "Max products per competitor (blank = all)"
        required: false
        default: ""
      debug:
        description: "Dump rendered-HTML diagnostics for the first product (1 = on)"
        required: false
        default: ""
      code:
        description: "Only scrape these model code(s), comma-separated (blank = all)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SCRAPE_SLUGS: ${{ github.event.inputs.slugs }}
          SCRAPE_LIMIT: ${{ github.event.inputs.limit }}
          SCRAPE_DEBUG: ${{ github.event.inputs.debug }}
          SCRAPE_CODE: ${{ github.event.inputs.code }}
        run: npm run scrape
